# Environnement de développement : PostgreSQL + API.
#   docker compose up -d --build        → API sur http://localhost:8000 (docs : /docs)
#   docker compose up -d db             → uniquement la base (pour lancer l'API ou les tests en local)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ludifun
      POSTGRES_PASSWORD: ludifun
      POSTGRES_DB: ludifun
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludifun -d ludifun"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      LUDIFUN_ENVIRONMENT: dev
      LUDIFUN_DATABASE_URL: postgresql+asyncpg://ludifun:ludifun@db:5432/ludifun
      # IA du serveur : Ollama sur ce PC par défaut (gratuit, rien ne sort de la maison). Chaque
      # famille peut en choisir une autre dans l'espace parent (« Intelligence artificielle »).
      # Autre choix par défaut, dans un fichier .env à la racine du dépôt (Windows :
      # Changer-IA-Ludifun.bat) :
      #   LUDIFUN_AI_PROVIDER=claude      (ou openai, gemini, mistral, groq, xai, compatible, fake)
      #   ANTHROPIC_API_KEY=sk-ant-...    (ou la clé du fournisseur choisi)
      #   LUDIFUN_AI_DAILY_BUDGET_USD=5
      LUDIFUN_AI_PROVIDER: ${LUDIFUN_AI_PROVIDER:-ollama}
      # Ollama tourne sur le PC, hors du conteneur : host.docker.internal désigne le PC.
      LUDIFUN_OLLAMA_BASE_URL: ${LUDIFUN_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LUDIFUN_AI_MODEL: ${LUDIFUN_AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # « compatible » : Azure OpenAI (l'IA de Copilot), OpenRouter, Ollama…
      LUDIFUN_AI_BASE_URL: ${LUDIFUN_AI_BASE_URL:-}
      LUDIFUN_AI_API_KEY: ${LUDIFUN_AI_API_KEY:-}
      # Plafond de dépense IA par jour, en dollars : au-delà, les analyses attendent le lendemain.
      LUDIFUN_AI_DAILY_BUDGET_USD: ${LUDIFUN_AI_DAILY_BUDGET_USD:-5}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # déjà défini sous Windows et macOS ; utile sous Linux
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
