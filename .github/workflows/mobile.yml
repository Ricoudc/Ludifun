name: Mobile

on:
  workflow_dispatch: # bouton « Run workflow » (une fois ce fichier sur la branche principale)
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  checks:
    name: Analyse, format et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances (versions figées par pubspec.lock)
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyse
        run: flutter analyze
      - name: Tests
        run: flutter test

  android:
    name: APK Android (debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compilation
        run: flutter build apk --debug
      # APK de test à télécharger (onglet Actions → cette exécution → « Artifacts ») : voir
      # docs/tester-sur-telephone.md. L'adresse du serveur se règle dans l'application.
      - name: APK de test téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ludifun-apk-test
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error
