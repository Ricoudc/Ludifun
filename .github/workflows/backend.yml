name: Backend

on:
  # Les branches de travail sont contrôlées via pull_request pour éviter
  # de lancer deux fois la même CI (push + pull_request) sur chaque PR.
  push:
    branches: [main]
    paths: ["backend/**", "eval/**", "docker-compose.yml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "eval/**", "docker-compose.yml", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ludifun
          POSTGRES_PASSWORD: ludifun
          POSTGRES_DB: ludifun_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ludifun"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      LUDIFUN_TEST_DATABASE_URL: postgresql+asyncpg://ludifun:ludifun@localhost:5432/ludifun_test
    steps:
      - uses: actions/checkout@v4
      # Same Debian image as production: Tesseract and language packs are
      # installed by backend/Dockerfile, not from the runner's flaky Ubuntu APT mirror.
      - name: Construire l'image de test (Tesseract inclus)
        run: docker build --tag ludifun-backend-ci .
      - name: Ruff, Mypy, tests et benchmark dans l'image du serveur
        run: |
          echo "Validation du commit $GITHUB_SHA"
          docker run --rm --user root --network host \
            -e LUDIFUN_TEST_DATABASE_URL="$LUDIFUN_TEST_DATABASE_URL" \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/backend ludifun-backend-ci \
            sh -c 'uv sync --frozen && uv run ruff check . && uv run ruff format --check . && uv run mypy app tests && uv run pytest -q && uv run python -m app.tools.evaluate ../eval/example --provider fake --out ../artifacts/quality-ai'
      - name: Publier le rapport et les résultats détaillés
        uses: actions/upload-artifact@v4
        with:
          name: ludifun-quality-ai-benchmark
          path: artifacts/quality-ai/
          if-no-files-found: error
          retention-days: 14

  compose:
    name: docker compose up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction et démarrage de la pile
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: L'API répond et la base est migrée
        run: curl --fail --silent http://localhost:8000/health/ready | grep '"status":"ok"'
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs
      - name: Arrêt
        if: always()
        run: docker compose down -v
