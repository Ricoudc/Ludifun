name: Android (Play Store)

# Bundle signé pour le Play Store (test fermé), à la demande ou sur une étiquette `mobile-v*`.
# Secrets et variable du dépôt à créer d'abord : voir docs/play-store.md.
on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  bundle:
    name: Bundle signé (AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Réglages présents
        env:
          API_URL: ${{ vars.LUDIFUN_API_URL }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::Variable LUDIFUN_API_URL absente ou pas en https://"; exit 1 ;;
          esac
          if [ -z "$KEYSTORE" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Clé de signature (effacée en fin de job)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Compilation
        run: >
          flutter build appbundle --release
          --dart-define=API_URL=${{ vars.LUDIFUN_API_URL }}
          --build-number=${{ github.run_number }}
      - name: Nettoyage de la clé
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
      # À déposer dans la Play Console (Tests → Test fermé → Créer une release).
      - uses: actions/upload-artifact@v4
        with:
          name: ludifun-play-store-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
